<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#6842a9">
  <title>A1.2 (13+14) Ders Ödevi</title>
  <link rel="stylesheet" href="assets/a12-13-14/homework.css">
  <script src="assets/a12-13-14/homework-data.js" defer></script>
  <script src="assets/a12-13-14/homework.js" defer></script>
  <script src="student-roster.js" defer></script>
</head>
<body>
  <main class="shell">
    <section class="card cover" id="intro">
      <p class="badge">A1.2 · 4. HAFTA</p>
      <h1>13–14. Ders Ödevi</h1>
      <p class="topic">Gustar y su familia · Presente · Estar + gerundio</p>
      <p class="muted">@ispanyolcacim · Profe Hazel</p>
      <ol class="cover-sections" id="coverSections"></ol>
      <form id="startForm">
        <label for="introName">Adın ve soyadın</label>
        <select id="introName" required><option value="">Adınızı seçin</option></select>
        <button class="primary full" type="submit">Başla →</button>
      </form>
    </section>

    <section id="quiz" hidden aria-label="Ödev soruları">
      <div class="card status">
        <div><strong id="studentLabel"></strong><span class="muted status-caption">A1.2 · 13–14. Ders</span></div>
        <div class="tally"><span class="positive" id="correctCount"></span><span class="negative" id="wrongCount"></span></div>
      </div>
      <div class="card submit-bar"><button id="finishButton" class="submit full" type="button">✔ Ödevi Teslim Et</button></div>
      <progress id="progress" value="0" max="50" aria-label="Cevaplanan sorular"></progress>
      <article class="card question" id="question"></article>
      <nav class="navigation" aria-label="Soru gezintisi">
        <button type="button" id="backButton">← Geri</button><strong id="counter" aria-live="polite"></strong><button type="button" id="nextButton">İleri →</button>
      </nav>
      <details class="card jump">
        <summary>Soru listesi</summary>
        <div id="questionList"></div>
      </details>
    </section>

    <section class="card" id="confirm" hidden>
      <h1>Ödevini teslim et</h1><p id="completion"></p>
      <form id="submitForm">
        <label for="resName2">Teslimde görünecek adın ve soyadın</label>
        <select id="resName2" required><option value="">Adınızı seçin</option></select>
        <p id="submitError" class="error" role="alert" hidden></p>
        <button type="submit" class="submit full" id="submitButton">✔ Ödevi Teslim Et</button>
        <button type="button" class="full" id="cancelButton">← Sorulara dön</button>
      </form>
    </section>

    <section id="result" class="card" aria-live="polite" hidden>
      <h1>Ödeviniz teslim edildi.</h1><p id="resultName"></p>
      <p id="score" class="score"></p><p id="resultCounts"></p>
      <details id="review"><summary>Cevaplarını gözden geçir</summary><div id="reviewList"></div></details>
    </section>
  </main>
  <dialog id="pictureDialog" aria-label="Park görseli">
    <form method="dialog"><button type="submit" autofocus>× Kapat</button></form>
    <img src="assets/a12-13-14/parque.webp" alt="Sorularda kullanılan park sahnesi" width="1200" height="800">
  </dialog>
</body>
</html>
